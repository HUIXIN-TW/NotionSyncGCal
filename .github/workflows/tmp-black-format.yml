name: Temporary Black Formatter

on:
  push:
    branches:
      - fix/black-format-worker

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/black-format-worker
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.31"

      - name: Format failing files
        run: |
          uv sync --frozen --dev
          uv run black src/main.py src/gcal/gcal_service.py src/config/mapping_domain_config.py --line-length 120

      - name: Commit formatting if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.py src/gcal/gcal_service.py src/config/mapping_domain_config.py
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "style: apply Black formatting"
          git push origin HEAD:fix/black-format-worker
