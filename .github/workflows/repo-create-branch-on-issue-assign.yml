name: Create Branch on Issue Assign

on:
  issues:
    types: [assigned]

permissions:
  contents: write
  issues: write

jobs:
  create-branch-and-add-link:
    runs-on: ubuntu-latest
    steps:
      - name: Create branch and add issue link
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const repository = context.payload.repository;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const normalizedTitle = issue.title
              .normalize("NFKD")
              .replace(/[^\x00-\x7F]/g, "")
              .replace(/[^a-zA-Z0-9-]+/g, "-")
              .replace(/^-+|-+$/g, "")
              .toLowerCase()
              .slice(0, 80);

            const branchName = `issue-${issue.number}${normalizedTitle ? `-${normalizedTitle}` : ""}`;
            const branchRef = `heads/${branchName}`;

            let branchExists = true;
            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: branchRef,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              branchExists = false;
            }

            if (!branchExists) {
              const base = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${repository.default_branch}`,
              });
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branchName}`,
                sha: base.data.object.sha,
              });
            }

            const branchLink = `[View branch](${repository.html_url}/tree/${encodeURIComponent(branchName)})`;
            const currentBody = issue.body ?? "";

            if (!currentBody.includes(branchLink)) {
              const newBody = currentBody
                ? `${currentBody}\n\n${branchLink}`
                : branchLink;
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                body: newBody,
              });
            }
