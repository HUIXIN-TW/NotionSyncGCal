name: Temporary Black Diff

on:
  push:
    branches:
      - fix/deploy-black-format-parity

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Black
        run: pip install black==24.4.2
      - name: Show Black diff
        run: |
          black src/contracts/notica_mapping_domain.py src/config/mapping_domain_config.py --line-length 120
          git diff -- src/contracts/notica_mapping_domain.py src/config/mapping_domain_config.py
