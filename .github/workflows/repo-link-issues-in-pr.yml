name: Link Issues in PR

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  link-issues:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Link issue in PR description
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullRequest = context.payload.pull_request;
            const match = pullRequest.head.ref.match(/^issue-(\d+)(?:-|$)/i);

            if (!match) {
              return;
            }

            const issueNumber = Number(match[1]);
            const issue = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });
            const currentPullRequest = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullRequest.number,
            });

            const issueLink = `${context.payload.repository.html_url}/issues/${issueNumber}`;
            const linkText = `Linked Issue: [${issue.data.title}](${issueLink})`;
            const fixText = `Fixes #${issueNumber}`;
            const currentBody = currentPullRequest.data.body ?? "";

            if (currentBody.includes(fixText)) {
              return;
            }

            const updatedBody = currentBody
              ? `${currentBody}\n\n${linkText}\n${fixText}`
              : `${linkText}\n${fixText}`;

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pullRequest.number,
              body: updatedBody,
            });
